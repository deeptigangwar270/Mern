
<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard Areas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f1f5f9;
        }

        .dashboard {
            display: grid;

            grid-template-columns: 200px 1fr;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: darkblue;
            color: white;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #dbeafe;
            padding: 20px;
        }

        .main {
            grid-area: main;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px gray;
        }

        .footer {
            grid-area: footer;
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
            <p>Logout</p>
        </aside>

        <main class="main">

            <h1>Dashboard Overview</h1>

            <div class="cards">

                <div class="card">
                    <h2>100</h2>
                    <p>Total Students</p>
                </div>

                <div class="card">
                    <h2>50</h2>
                    <p>Total Courses</p>
                </div>

                <div class="card">
                    <h2>80</h2>
                    <p>Completed Tasks</p>
                </div>

            </div>

        </main>

        <footer class="footer">
            <p>My Dashboard 2026</p>
        </footer>

    </div>

</body>
</html>
