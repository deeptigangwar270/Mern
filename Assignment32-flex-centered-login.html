
<!DOCTYPE html>
<html>
<head>
    <title>Flex Centered Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightblue;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px gray;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Form</h2>

        <form>

            <input type="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

            <a href="#">Forgot Password?</a>

        </form>

    </div>

</body>
</html>
