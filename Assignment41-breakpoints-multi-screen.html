
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Screen Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            flex: 1;
            text-align: center;
            border-radius: 10px;
        }

        /* Tablet screen */
        @media (max-width: 900px) {
            .container {
                flex-wrap: wrap;
            }

            .card {
                flex: 1 1 40%;
            }
        }

        /* Mobile screen */
        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 10px;
            }

            .container {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Responsive Multi Screen Design</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>HTML creates the structure of a webpage.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>CSS makes a webpage beautiful.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript adds functionality.</p>
        </div>

    </div>

</body>
</html>
