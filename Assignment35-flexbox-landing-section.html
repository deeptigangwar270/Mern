
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Landing Section</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f0f4f8;
        }

        .landing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px;
            gap: 30px;
            min-height: 350px;
        }

        .content {
            flex: 1;
        }

        .content h1 {
            color: darkblue;
            font-size: 40px;
        }

        .content p {
            font-size: 18px;
            color: #444;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .image {
            flex: 1;
            background-color: lightblue;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            .landing {
                flex-direction: column;
                padding: 25px;
            }

            .content h1 {
                font-size: 30px;
            }

            .image {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <section class="landing">

        <div class="content">

            <h1>Welcome to My Website</h1>

            <p>
                Learn Web Development with HTML,
                CSS and JavaScript.
                Start your coding journey today.
            </p>

            <button>Get Started</button>

        </div>

        <div class="image">
            My Image
        </div>

    </section>

</body>
</html>
