
<!DOCTYPE html>
<html>
<head>
    <title>Flex Navbar Hero</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Navbar */
        .navbar {
            background-color: darkblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .menu a:hover {
            color: yellow;
        }

        /* Hero Section */
        .hero {
            background-color: lightblue;
            min-height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero-content h1 {
            color: darkblue;
            font-size: 35px;
        }

        .hero-content p {
            font-size: 18px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            My Website
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Welcome to My Website</h1>

            <p>
                Learn HTML, CSS and Web Development
                in an easy way.
            </p>

            <button>Get Started</button>

        </div>

    </section>

</body>
</html>
