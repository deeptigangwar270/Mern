
<!DOCTYPE html>
<html>
<head>
    <title>Fix Overflow</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .container {
            width: 300px;
            height: 150px;
            background-color: white;
            border: 2px solid blue;
            margin: 30px auto;
            padding: 15px;

            overflow: auto;
        }

        .box {
            width: 250px;
            height: 250px;
            background-color: lightblue;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Fix Overflow Example</h1>

    <div class="container">

        <div class="box">
            <h2>Overflow Problem</h2>

            <p>
                This is an example of CSS overflow.
                Sometimes content becomes bigger
                than its container.
            </p>

            <p>
                CSS overflow helps us manage
                extra content inside a box.
            </p>

            <p>
                We can use auto, hidden,
                scroll and visible properties.
            </p>

        </div>

    </div>

</body>
</html>
