
<!DOCTYPE html>
<html>
<head>
    <title>Grid Photo Gallery</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Nature">
        
        <img src="https://picsum.photos/id/1016/400/300" alt="Mountain">

        <img src="https://picsum.photos/id/1018/400/300" alt="Forest">

        <img src="https://picsum.photos/id/1020/400/300" alt="River">

        <img src="https://picsum.photos/id/1024/400/300" alt="Animal">

        <img src="https://picsum.photos/id/1035/400/300" alt="Waterfall">

    </div>

</body>
</html>
