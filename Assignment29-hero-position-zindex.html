
<!DOCTYPE html>
<html>
<head>
    <title>Hero Position Z-Index</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .hero {
            height: 400px;
            background-color: lightblue;
            position: relative;
            text-align: center;
            padding: 30px;
        }

        .box1 {
            background-color: blue;
            color: white;
            padding: 20px;
            width: 200px;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 1;
        }

        .box2 {
            background-color: orange;
            color: white;
            padding: 20px;
            width: 200px;
            position: absolute;
            top: 150px;
            left: 180px;
            z-index: 2;
        }

        button {
            padding: 10px 20px;
            background-color: darkblue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <section class="hero">

        <h1>Welcome to My Website</h1>

        <p>Learn HTML and CSS Easily</p>

        <button>Explore More</button>

        <div class="box1">
            Box 1
        </div>

        <div class="box2">
            Box 2
        </div>

    </section>

</body>
</html>
