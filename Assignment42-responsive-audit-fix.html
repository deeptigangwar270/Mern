
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Audit Fix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 0;
        }

        .card img {
            width: 100%;
            max-width: 200px;
            height: auto;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            header h1 {
                font-size: 24px;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Website</h1>
        <p>Responsive Audit and Fix</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>HTML creates webpage structure.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>CSS styles the webpage.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript adds functionality.</p>
        </div>

    </div>

</body>
</html>
