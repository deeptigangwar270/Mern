
<!DOCTYPE html>
<html>
<head>
    <title>Grid Auto Fit Products</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .products {
            display: grid;
            grid-template-columns:
            repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px gray;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            color: #555;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <h2>Laptop</h2>
            <p>Price: ₹45000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Mobile</h2>
            <p>Price: ₹15000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p>Price: ₹2000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p>Price: ₹1000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p>Price: ₹500</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Smart Watch</h2>
            <p>Price: ₹3000</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
