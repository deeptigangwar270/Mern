
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landing Page Skeleton</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Header */
        header {
            background-color: navy;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        /* Navbar */
        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 60px 40px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 40px;
            color: navy;
        }

        .hero-content p {
            font-size: 18px;
            line-height: 1.5;
        }

        .hero-image {
            background-color: lightblue;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px 40px;
        }

        .feature {
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        /* Footer */
        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">

        <div class="hero-content">
            <h1>Welcome to My Website</h1>

            <p>
                I am a BCA student interested in
                programming, web development and AI.
            </p>

            <button>Get Started</button>
        </div>

        <div class="hero-image">
            Image Section
        </div>

    </section>

    <section class="features">

        <div class="feature">
            <h2>HTML</h2>
            <p>Webpage Structure</p>
        </div>

        <div class="feature">
            <h2>CSS</h2>
            <p>Webpage Design</p>
        </div>

        <div class="feature">
            <h2>JavaScript</h2>
            <p>Webpage Functionality</p>
        </div>

    </section>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
