
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images with Alt Text</title>
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Welcome to my personal webpage.</p>
    </header>

    <main>

        <section>
            <h2>My Introduction</h2>

            <img src="profile.jpg"
                 alt="My profile picture"
                 width="200">

            <p>Hello! My name is Deepti Gangwar.</p>
        </section>

        <section>
            <h2>Nature Images</h2>

            <img src="nature.jpg"
                 alt="Beautiful green nature"
                 width="300">

            <img src="mountain.jpg"
                 alt="Beautiful mountains"
                 width="300">
        </section>

        <section>
            <h2>My Favourite Places</h2>

            <img src="nainital.jpg"
                 alt="Beautiful view of Nainital"
                 width="300">

        </section>

    </main>

    <footer>
        <p>Created by Deepti Gangwar</p>
    </footer>

</body>
</html>
