
<!DOCTYPE html>
<html>
<head>
    <title>Flex Menu Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background-color: darkblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .menu a:hover {
            color: yellow;
        }

        .content {
            text-align: center;
            padding: 60px;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            My Website
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <div class="content">

        <h1>Welcome to My Website</h1>

        <p>This is my Flex Menu Bar Assignment.</p>

    </div>

</body>
</html>
